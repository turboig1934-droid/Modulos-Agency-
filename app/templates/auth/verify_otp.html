{% extends "base.html" %}

{% block title %}Verify OTP - Modulos Agency{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="container">
        <div class="auth-container">
            <div class="auth-box">
                <div class="auth-header">
                    <h2>Verify Your Email</h2>
                    <p>A 4-digit verification code has been sent to <strong>{{ email }}</strong></p>
                </div>
                
                <form method="POST" class="auth-form" id="otpForm">
                    <div class="form-group">
                        <label>Enter Verification Code</label>
                        <input type="text" name="otp" placeholder="Enter 4-digit code" maxlength="4" required autofocus>
                    </div>
                    
                    <button type="submit" class="btn-primary btn-full">Verify Email</button>
                </form>
                
                <div class="auth-footer">
                    <p>Didn't receive the code?</p>
                    <button onclick="resendOTP()" class="btn-secondary" id="resendBtn">Resend OTP</button>
                    <p id="resendMessage" style="margin-top: 10px; display: none;"></p>
                </div>
                
                <div class="auth-footer" style="margin-top: 10px;">
                    <a href="{{ url_for('auth.login') }}">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
function resendOTP() {
    const btn = document.getElementById('resendBtn');
    const msg = document.getElementById('resendMessage');
    
    btn.disabled = true;
    btn.textContent = 'Sending...';
    msg.style.display = 'none';
    
    fetch('/auth/resend-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
    })
    .then(response => response.json())
    .then(data => {
        msg.style.display = 'block';
        if (data.success) {
            msg.style.color = '#28a745';
            msg.textContent = '✅ ' + data.message;
        } else {
            msg.style.color = '#dc3545';
            msg.textContent = '❌ ' + data.message;
        }
        btn.disabled = false;
        btn.textContent = 'Resend OTP';
    })
    .catch(error => {
        msg.style.display = 'block';
        msg.style.color = '#dc3545';
        msg.textContent = '❌ Failed to send. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Resend OTP';
    });
}
</script>
{% endblock %}
