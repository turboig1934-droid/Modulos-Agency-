{% extends "base.html" %}

{% block title %}Forgot Password - Modulos Agency{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="container">
        <div class="auth-container">
            <div class="auth-box">
                <div class="auth-header">
                    <h2>🔑 Forgot Password</h2>
                    <p>Enter your email to receive a password reset link</p>
                </div>
                
                <form method="POST" class="auth-form">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="you@example.com" required>
                    </div>
                    
                    <button type="submit" class="btn-primary btn-full">Send Reset Link</button>
                </form>
                
                <div class="auth-footer">
                    <p><a href="{{ url_for('auth.login') }}">← Back to Login</a></p>
                    <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
