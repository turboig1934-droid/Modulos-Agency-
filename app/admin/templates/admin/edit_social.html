{% extends "admin/base.html" %}

{% block page_title %}Edit Social Link{% endblock %}

{% block content %}
<div class="admin-card">
    <div class="admin-card-header">
        <h3>Edit Social Link</h3>
        <a href="{{ url_for('admin.social') }}" class="btn-secondary" style="padding:6px 16px; text-decoration:none;">← Back</a>
    </div>
    <div style="padding:20px; max-width:500px;">
        <form method="POST" action="{{ url_for('admin.update_social', id=link.id) }}">
            <div class="form-group">
                <label>Platform</label>
                <select name="platform" required style="width:100%; padding:10px; border:2px solid #d6e5ff; border-radius:8px;">
                    <option value="YouTube" {% if link.name == 'YouTube' %}selected{% endif %}>YouTube</option>
                    <option value="Twitter" {% if link.name == 'Twitter' %}selected{% endif %}>Twitter</option>
                    <option value="Instagram" {% if link.name == 'Instagram' %}selected{% endif %}>Instagram</option>
                    <option value="Facebook" {% if link.name == 'Facebook' %}selected{% endif %}>Facebook</option>
                    <option value="Discord" {% if link.name == 'Discord' %}selected{% endif %}>Discord</option>
                    <option value="GitHub" {% if link.name == 'GitHub' %}selected{% endif %}>GitHub</option>
                    <option value="LinkedIn" {% if link.name == 'LinkedIn' %}selected{% endif %}>LinkedIn</option>
                    <option value="TikTok" {% if link.name == 'TikTok' %}selected{% endif %}>TikTok</option>
                </select>
            </div>
            <div class="form-group">
                <label>URL</label>
                <input type="url" name="url" value="{{ link.url }}" required style="width:100%; padding:10px; border:2px solid #d6e5ff; border-radius:8px;">
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="is_active" {% if link.is_active %}checked{% endif %}> Active
                </label>
            </div>
            <button type="submit" class="btn-primary">Update Link</button>
            <a href="{{ url_for('admin.social') }}" class="btn-secondary" style="padding:10px 24px; text-decoration:none;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
