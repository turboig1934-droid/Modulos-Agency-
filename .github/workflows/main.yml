      # Step 2: Run a multi-line script placeholder
      - name: Run a One-Line Script
        run: echo "Starting the automated CI workflow..."

      # Step 3: Run an example build step
      - name: Build application step
        run: |
          echo "Building dependencies..."
          echo "Done!"
