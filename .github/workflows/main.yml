name: Deploy Modulos Agency with MEGA Storage

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "⚠️ No requirements.txt found. Skipping..."
        fi

    - name: Install MEGA Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y megatools

    - name: Check if data exists on MEGA
      id: check_remote
      continue-on-error: true
      run: |
        echo "🔍 Checking if data exists on MEGA..."
        megatools ls --username "${{ secrets.MEGA_EMAIL }}" \
          --password "${{ secrets.MEGA_PASSWORD }}" \
          "https://mega.nz/folder/${{ secrets.MEGA_FOLDER_ID }}#${{ secrets.MEGA_ENCRYPTION_KEY }}" > /tmp/mega_list.txt 2>&1 || true
        
        if grep -q "modulos.db" /tmp/mega_list.txt; then
          echo "✅ Data found on MEGA!"
          echo "data_exists=true" >> $GITHUB_OUTPUT
        else
          echo "⚠️ No data found on MEGA!"
          echo "data_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Download data from MEGA (if exists)
      if: steps.check_remote.outputs.data_exists == 'true'
      run: |
        mkdir -p ./data
        echo "📥 Downloading data from MEGA..."
        megatools dl --path ./data/ \
          --username "${{ secrets.MEGA_EMAIL }}" \
          --password "${{ secrets.MEGA_PASSWORD }}" \
          "https://mega.nz/folder/${{ secrets.MEGA_FOLDER_ID }}#${{ secrets.MEGA_ENCRYPTION_KEY }}"
        echo "✅ Data downloaded successfully!"

    - name: Restore database (if downloaded)
      if: steps.check_remote.outputs.data_exists == 'true'
      run: |
        if [ -f "./data/instance/modulos.db" ]; then
          echo "✅ Database found in downloaded data! Restoring..."
          mkdir -p ./instance
          cp ./data/instance/modulos.db ./instance/modulos.db
          echo "✅ Database restored!"
        else
          echo "⚠️ No database found in downloaded data. Creating fresh..."
          if [ -f init_db.py ]; then
            python init_db.py
          elif [ -f fix_db.py ]; then
            python fix_db.py
          else
            echo "❌ No database initialization script found!"
            exit 1
          fi
        fi

    - name: Initialize fresh database (if no data on MEGA)
      if: steps.check_remote.outputs.data_exists == 'false'
      run: |
        echo "⚠️ No data on MEGA. Creating fresh database..."
        if [ -f init_db.py ]; then
          python init_db.py
        elif [ -f fix_db.py ]; then
          python fix_db.py
        else
          echo "❌ No database initialization script found!"
          exit 1
        fi
        echo "✅ Fresh database created!"

    - name: Run database migrations (if needed)
      run: |
        if [ -f manage.py ]; then
          python manage.py db upgrade || echo "⚠️ No migrations to apply."
        fi

    - name: Run application
      run: |
        echo "🚀 Starting Modulos Agency application..."
        if [ -f run.py ]; then
          python run.py &
          sleep 3
          echo "✅ Application started successfully!"
        elif [ -f app.py ]; then
          python app.py &
          sleep 3
          echo "✅ Application started successfully!"
        elif [ -f manage.py ]; then
          python manage.py runserver &
          sleep 3
          echo "✅ Application started successfully!"
        else
          echo "❌ No Python application found!"
          exit 1
        fi

    - name: Delete old data on MEGA (cleanup)
      if: always()
      run: |
        echo "🗑️ Deleting old data from MEGA..."
        megatools rm --username "${{ secrets.MEGA_EMAIL }}" \
          --password "${{ secrets.MEGA_PASSWORD }}" \
          "https://mega.nz/folder/${{ secrets.MEGA_FOLDER_ID }}#${{ secrets.MEGA_ENCRYPTION_KEY }}" || echo "⚠️ No files to delete or folder empty."

    - name: Upload new data to MEGA
      if: always()
      run: |
        echo "📤 Uploading new data to MEGA..."
        mkdir -p ./data/instance
        if [ -f "./instance/modulos.db" ]; then
          cp ./instance/modulos.db ./data/instance/modulos.db
          echo "✅ Database backed up!"
        else
          echo "⚠️ No database found to backup!"
        fi
        megatools put --username "${{ secrets.MEGA_EMAIL }}" \
          --password "${{ secrets.MEGA_PASSWORD }}" \
          --path "/modulos-data" \
          --folder-id "${{ secrets.MEGA_FOLDER_ID }}" \
          --encryption-key "${{ secrets.MEGA_ENCRYPTION_KEY }}" \
          ./data/*
        echo "✅ Data uploaded successfully! Old data was replaced."

    - name: Show debug information
      if: always()
      run: |
        echo "📁 Data folder contents:"
        ls -la ./data/ || echo "No data folder"
        echo ""
        echo "📁 Instance folder contents:"
        ls -la ./instance/ || echo "No instance folder"

    - name: Run tests (optional)
      run: |
        if [ -f test.py ]; then
          python test.py
        elif [ -d tests ]; then
          pip install pytest
          pytest tests/ -v || echo "⚠️ Tests failed but continuing..."
        fi
