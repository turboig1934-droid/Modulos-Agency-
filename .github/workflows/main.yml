name: Deploy Modulos Agency with MEGA Storage

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "⚠️ No requirements.txt found. Skipping..."
        fi

    - name: Install MEGA Tools (Latest Version)
      run: |
        sudo apt-get update
        # Official MEGA CMD install (zyada stable)
        sudo apt-get install -y wget
        wget https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb
        sudo dpkg -i megacmd-xUbuntu_22.04_amd64.deb || sudo apt-get install -f -y
        # Fallback: agar megacmd nahi chala toh megatools try karein
        sudo apt-get install -y megatools || true

    - name: Login to MEGA
      id: login
      continue-on-error: true
      run: |
        echo "🔑 Logging in to MEGA..."
        mega-login "${{ secrets.MEGA_EMAIL }}" "${{ secrets.MEGA_PASSWORD }}" || echo "⚠️ Login failed, trying megatools..."

    - name: Check if data exists on MEGA
      id: check_remote
      continue-on-error: true
      run: |
        echo "🔍 Checking if data exists on MEGA..."
        # Try megatools first
        megatools ls "https://mega.nz/folder/${{ secrets.MEGA_FOLDER_ID }}#${{ secrets.MEGA_ENCRYPTION_KEY }}" > /tmp/mega_list.txt 2>&1 || true
        if grep -q "modulos.db" /tmp/mega_list.txt; then
          echo "✅ Data found on MEGA!"
          echo "data_exists=true" >> $GITHUB_OUTPUT
        else
          echo "⚠️ No data found on MEGA!"
          echo "data_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Download data from MEGA (if exists)
      if: steps.check_remote.outputs.data_exists == 'true'
      run: |
        mkdir -p ./data
        echo "📥 Downloading data from MEGA..."
        megatools dl --path ./data/ \
          "https://mega.nz/folder/${{ secrets.MEGA_FOLDER_ID }}#${{ secrets.MEGA_ENCRYPTION_KEY }}" || \
        mega-get "https://mega.nz/folder/${{ secrets.MEGA_FOLDER_ID }}#${{ secrets.MEGA_ENCRYPTION_KEY}" ./data/
        echo "✅ Data downloaded successfully!"

    - name: Restore database (if downloaded)
      if: steps.check_remote.outputs.data_exists == 'true'
      run: |
        if [ -f "./data/instance/modulos.db" ]; then
          echo "✅ Database found! Restoring..."
          mkdir -p ./instance
          cp ./data/instance/modulos.db ./instance/modulos.db
          echo "✅ Database restored!"
        else
          echo "⚠️ No database found. Creating fresh..."
          if [ -f init_db.py ]; then
            python init_db.py
          elif [ -f fix_db.py ]; then
            python fix_db.py
          else
            echo "❌ No database initialization script found!"
            exit 1
          fi
        fi

    - name: Initialize fresh database (if no data on MEGA)
      if: steps.check_remote.outputs.data_exists == 'false'
      run: |
        echo "⚠️ No data on MEGA. Creating fresh database..."
        if [ -f init_db.py ]; then
          python init_db.py
        elif [ -f fix_db.py ]; then
          python fix_db.py
        else
          echo "❌ No database initialization script found!"
          exit 1
        fi
        echo "✅ Fresh database created!"

    - name: Run application
      run: |
        echo "🚀 Starting Modulos Agency application..."
        if [ -f run.py ]; then
          python run.py &
          sleep 3
          echo "✅ Application started!"
        elif [ -f app.py ]; then
          python app.py &
          sleep 3
          echo "✅ Application started!"
        else
          echo "❌ No Python application found!"
          exit 1
        fi

    - name: Delete old data on MEGA (cleanup)
      if: always()
      continue-on-error: true
      run: |
        echo "🗑️ Deleting old data from MEGA..."
        # Multiple methods try karein
        mega-rm /modulos-data/ || true
        megatools rm "https://mega.nz/folder/${{ secrets.MEGA_FOLDER_ID }}#${{ secrets.MEGA_ENCRYPTION_KEY }}" || true

    - name: Upload new data to MEGA
      if: always()
      continue-on-error: true
      run: |
        echo "📤 Uploading new data to MEGA..."
        mkdir -p ./data/instance
        if [ -f "./instance/modulos.db" ]; then
          cp ./instance/modulos.db ./data/instance/modulos.db
          echo "✅ Database backed up!"
        fi
        # Method 1: mega-put
        mega-put ./data /modulos-data/ || \
        # Method 2: megatools put
        megatools put --path "/modulos-data" \
          ./data/* || \
        # Method 3: mega-put with full URL
        mega-put ./data "https://mega.nz/folder/${{ secrets.MEGA_FOLDER_ID }}#${{ secrets.MEGA_ENCRYPTION_KEY }}/modulos-data" || true
        echo "✅ Upload attempt complete!"

    - name: Show debug information
      if: always()
      run: |
        echo "📁 Data folder contents:"
        ls -la ./data/ || echo "No data folder"
        echo ""
        echo "📁 Instance folder contents:"
        ls -la ./instance/ || echo "No instance folder"
