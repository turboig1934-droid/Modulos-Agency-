name: CI Pipeline

# Triggers the workflow on push or pull request events but only for the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test Job
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
